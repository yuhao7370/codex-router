<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Router · CTM</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef1f6;
    --card: #ffffff;
    --border: #e3e8f0;
    --text: #161d2b;
    --muted: #68738a;
    --accent: #4f46e5;
    --accent2: #7c3aed;
    --ok: #0a9d6c;
    --ok-bg: #e4f7ef;
    --err: #d9385e;
    --err-bg: #fdeef2;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(99, 102, 241, 0.2); }
  body {
    margin: 0; padding: 24px 28px 40px; min-height: 100vh;
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1000px 420px at 12% -10%, rgba(99, 102, 241, 0.10), transparent 60%),
      radial-gradient(900px 400px at 88% -8%, rgba(13, 148, 136, 0.08), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { width: 100%; display: flex; flex-direction: column; gap: 18px; }

  /* ===== 页头 ===== */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; padding: 2px 2px 0;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .header-actions { display: flex; align-items: center; gap: 10px; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600;
    background: #fff; border: 1px solid var(--border); color: var(--muted);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #b6bfce; flex: none; }
  .pill.on { color: var(--ok); }
  .pill.on::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(10, 157, 108, 0.15); animation: pulse 2s infinite; }
  .pill.off { color: var(--err); }
  .pill.off::before { background: var(--err); }
  a.pill { text-decoration: none; color: var(--accent); transition: border-color 0.12s ease; }
  a.pill::before { display: none; }
  a.pill:hover { border-color: var(--accent); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ===== 概览卡片 ===== */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .stat { display: flex; flex-direction: column; }
  .stat-label {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .stat-value { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-value .badge { font-size: 13px; padding: 5px 14px; }
  .stat-value.small {
    font-size: 14px; font-weight: 600;
    font-family: ui-monospace, Consolas, monospace;
    word-break: break-all;
  }
  .stat-foot { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .stat-foot .mono { font-family: ui-monospace, Consolas, monospace; }
  .stat-actions { margin-top: 12px; }
  .stat-actions button { padding: 8px 13px; font-size: 12px; }

  /* ===== 卡片 ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 26px rgba(16, 24, 40, 0.05);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card h2 {
    display: flex; align-items: center; gap: 9px;
    margin: 0; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em; color: #2b3550;
  }
  .card h2::before {
    content: ""; width: 4px; height: 14px; border-radius: 2px; flex: none;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
  }

  /* ===== 主体布局 ===== */
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1.65fr) minmax(340px, 1fr);
    gap: 18px; align-items: start;
  }
  .side { display: flex; flex-direction: column; gap: 18px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: #f1f4f9; color: var(--muted);
  }
  .badge.on::before, .badge.off::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.on { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--err-bg); color: var(--err); }

  /* ===== 额度条 ===== */
  .quota-bar {
    height: 6px; border-radius: 999px; overflow: hidden;
    background: #e8ecf3; margin-top: 10px;
  }
  .quota-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #0d9488);
    transition: width 0.4s ease;
  }
  .quota-fill.warn { background: linear-gradient(90deg, #f59e0b, #f97316); }
  .quota-fill.low { background: linear-gradient(90deg, #f43f5e, #e11d48); }

  /* ===== 按钮 ===== */
  button {
    appearance: none; border: 0; cursor: pointer;
    font: 600 13px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #fff; padding: 10px 16px; border-radius: 9px;
    background: linear-gradient(135deg, #6366f1, #7c3aed);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.28);
    transition: transform 0.12s ease, filter 0.12s ease;
    margin: 4px 6px 0 0;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost {
    background: #fff; border: 1px solid #d6dde8; color: #3c4763;
    box-shadow: none;
  }
  button.ghost:hover { background: #f4f6fa; }
  button:disabled { opacity: 0.4; cursor: default; transform: none; filter: none; box-shadow: none; }
  .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .select-btn, .unblock-btn, #refresh-accounts, #save-pool, #clear-pool { padding: 7px 13px; font-size: 12px; margin: 0; }

  /* ===== 结果框 / 日志 ===== */
  .result {
    margin-top: 12px; padding: 10px 12px; border-radius: 9px;
    background: #f6f8fb; border: 1px solid #e5eaf2;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    color: var(--muted);
    white-space: pre-wrap; word-break: break-all;
  }
  .result.ok { background: var(--ok-bg); border-color: #bfe8d8; color: var(--ok); }
  .result.err { background: var(--err-bg); border-color: #f6cdd8; color: var(--err); }
  #injection-log { margin-top: 0; max-height: 220px; overflow: auto; }
  #injection-log::-webkit-scrollbar { width: 8px; }
  #injection-log::-webkit-scrollbar-thumb { background: #d6dde8; border-radius: 4px; }
  #injection-log::-webkit-scrollbar-track { background: transparent; }

  /* ===== 表格 ===== */
  .table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 9px 12px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--muted); background: #fafbfd;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    text-align: left; padding: 11px 12px; font-size: 13px;
    border-bottom: 1px solid #eef1f6;
    white-space: nowrap;
  }
  tbody tr { transition: background 0.12s ease; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); }

  /* ===== 表单 ===== */
  .field { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .field:first-of-type { margin-top: 0; }
  .field:last-child { margin-bottom: 0; }
  label { color: var(--muted); font-size: 13px; }
  .field > label:not(.switch-label) { min-width: 42px; }
  .switch-label { display: flex; align-items: center; cursor: pointer; color: var(--text); }

  input:not([type=checkbox]):not([type=file]) {
    background: #fff; border: 1px solid #d6dde8; color: var(--text);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; width: 180px;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  input:not([type=checkbox]):not([type=file]):focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  input[type=file] { color: var(--muted); font-size: 12px; max-width: 280px; }
  input[type=file]::file-selector-button {
    appearance: none; cursor: pointer; font-size: 12px; font-weight: 600;
    color: #3c4763; padding: 7px 12px; margin-right: 10px;
    border-radius: 8px; border: 1px solid #d6dde8; background: #f1f4f9;
    transition: background 0.12s ease;
  }
  input[type=file]::file-selector-button:hover { background: #e6ebf3; }

  /* 开关 */
  input.switch {
    appearance: none; -webkit-appearance: none;
    width: 40px; height: 22px; border-radius: 999px; flex: none;
    background: #cbd5e1; position: relative; cursor: pointer;
    margin: 0 10px 0 0;
    transition: background 0.15s ease;
  }
  input.switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.25);
    transition: left 0.15s ease;
  }
  input.switch:checked { background: linear-gradient(135deg, #6366f1, #7c3aed); }
  input.switch:checked::after { left: 20px; }

  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    background: #fff; border: 1px solid #d6dde8; color: var(--text);
    border-radius: 9px; padding: 10px 12px;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .hint a { color: var(--accent); text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  #pool-hint { margin: 6px 0 10px; }

  @media (max-width: 1200px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .main { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    body { padding: 16px 14px 32px; }
    .stats { grid-template-columns: 1fr; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div>
      <h1>Codex Router</h1>
      <div class="sub">Codex_Task_Manager 账号代理控制台</div>
    </div>
    <div class="header-actions">
      <a class="pill" href="/converter" target="_blank">打开转换器</a>
      <div id="header-status" class="pill">…</div>
    </div>
  </header>

  <section class="stats">
    <div class="card stat">
      <div class="stat-label">代理状态</div>
      <div class="stat-value"><span id="enabled-badge" class="badge off">…</span></div>
      <div class="stat-foot">端口 <span class="mono" id="port">…</span> · Token <span class="mono" id="token">…</span></div>
      <div class="stat-actions">
        <button id="enable-btn">启用</button>
        <button class="ghost" id="disable-btn">停用</button>
        <button class="ghost" id="test-btn">测试连接</button>
      </div>
      <div id="test-result" class="result" hidden></div>
    </div>
    <div class="card stat">
      <div class="stat-label">当前使用账号</div>
      <div class="stat-value small" id="active-account">…</div>
      <div class="stat-foot">未获取时自动回退原生登录</div>
    </div>
    <div class="card stat">
      <div class="stat-label">订阅 / 剩余额度</div>
      <div class="stat-value" id="account-quota">…</div>
      <div class="quota-bar" id="quota-bar" hidden><div class="quota-fill" id="quota-fill" style="width:0%"></div></div>
      <div class="stat-foot">更新于 <span id="quota-updated">…</span></div>
    </div>
    <div class="card stat">
      <div class="stat-label">故障自动切换</div>
      <div class="stat-value"><span id="failover-badge" class="badge">…</span></div>
      <div class="stat-foot">上次切换：<span id="failover-last">…</span></div>
    </div>
  </section>

  <div class="main">
    <div class="card">
      <div class="card-head">
        <h2>CTM 账号</h2>
        <div class="head-actions">
          <button class="ghost" id="refresh-accounts">刷新账号</button>
          <button class="ghost" id="save-pool">保存轮询池</button>
          <button class="ghost" id="clear-pool">清空池</button>
        </div>
      </div>
      <div class="result" id="accounts-error" hidden></div>
      <p class="hint" id="pool-hint">轮询池：未启用（勾选账号并保存后启用均匀派发）</p>
      <div class="table-wrap">
      <table>
        <thead><tr><th>池</th><th>邮箱</th><th>ID</th><th>来源</th><th>状态</th><th>额度</th><th></th></tr></thead>
        <tbody id="accounts-body"></tbody>
      </table>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="card-head"><h2>导入账号</h2></div>
        <p class="hint">粘贴 auth.json，或直接粘贴 sub2api 导出的 JSON（会自动转换）。<a href="/converter" target="_blank">打开独立转换器</a></p>
        <textarea id="import-input" placeholder='{"tokens":{"access_token":"..."}}'></textarea>
        <div class="field">
          <input type="file" id="import-file" accept=".json,application/json">
          <button class="ghost" id="import-btn">导入</button>
        </div>
        <div class="result" id="import-result" hidden></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>注入日志</h2>
          <span class="stat-foot" style="margin:0">成功 <span class="mono" id="injection-count">0</span> 次</span>
        </div>
        <div id="injection-log" class="result">暂无注入记录</div>
      </div>

      <div class="card">
        <div class="card-head"><h2>设置</h2></div>
        <div class="field">
          <label class="switch-label"><input type="checkbox" id="failover-toggle" class="switch"> 额度用光/不可用时自动切换账号</label>
        </div>
        <div class="field">
          <label>端口</label>
          <input id="port-input" type="number" min="1" max="65535" placeholder="6000">
          <button class="ghost" id="save-port">保存</button>
        </div>
        <div class="field">
          <label>Token</label>
          <input id="token-input" type="password" placeholder="留空 = 自动读取">
          <button class="ghost" id="save-token">保存</button>
          <button class="ghost" id="clear-token">清除</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  async function api(path, options) {
    const response = await fetch(path, options);
    let body = null;
    try { body = await response.json(); } catch (e) {}
    if (!response.ok) {
      throw new Error(body && body.error ? body.error : ('HTTP ' + response.status));
    }
    return body;
  }

  function el(id) { return document.getElementById(id); }
  function setResult(id, ok, text) {
    const node = el(id);
    node.hidden = false;
    node.className = 'result ' + (ok ? 'ok' : 'err');
    node.textContent = text;
  }
  function hideResult(id) { el(id).hidden = true; }

  function formatAge(timestamp) {
    if (!timestamp) return '—';
    const seconds = Math.max(0, Math.floor(Date.now() / 1000) - timestamp);
    if (seconds < 60) return '刚刚';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + ' 分钟前';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小时前';
    return Math.floor(hours / 24) + ' 天前';
  }

  function formatTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    const p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function shortId(id) {
    const value = String(id || '');
    return value.length > 12 ? value.slice(0, 8) + '…' : value;
  }

  let accountIndex = new Map();
  let currentPool = new Set();
  let blockedAccounts = new Set();

  function buildAccountIndex(accounts) {
    accountIndex = new Map();
    for (const account of accounts || []) {
      const info = {
        email: account.email || '',
        plan: account.usage && account.usage.plan
          ? String(account.usage.plan).toUpperCase()
          : '',
      };
      if (account.account_id) accountIndex.set(account.account_id, info);
      if (account.id) accountIndex.set(account.id, info);
    }
  }

  function normalizeImport(raw) {
    let data;
    try { data = JSON.parse(raw); } catch (error) { throw new Error('不是有效的 JSON'); }
    if (data && data.tokens && typeof data.tokens.access_token === 'string') {
      return data;
    }
    if (data && Array.isArray(data.accounts) && data.accounts.length) {
      const account = data.accounts[0];
      const credentials = account && account.credentials;
      if (credentials && typeof credentials.access_token === 'string') {
        return {
          tokens: {
            access_token: credentials.access_token,
            account_id: credentials.chatgpt_account_id || credentials.account_id || '',
            id_token: credentials.id_token || '',
            refresh_token: credentials.refresh_token || '',
          },
        };
      }
    }
    throw new Error('无法识别格式（需要 auth.json 或 sub2api 导出）');
  }

  async function loadStatus() {
    const status = await api('/api/status');
    el('enabled-badge').textContent = status.enabled ? '已启用' : '未启用';
    el('enabled-badge').className = 'badge ' + (status.enabled ? 'on' : 'off');
    const headerStatus = el('header-status');
    headerStatus.textContent = status.enabled ? '代理运行中' : '代理未启用';
    headerStatus.className = 'pill ' + (status.enabled ? 'on' : 'off');
    el('port').textContent = String(status.port);
    el('token').textContent = status.token === 'set' ? '已设置' : '自动读取';
    el('active-account').textContent = status.account && status.account.accountId ? status.account.accountId : '（未获取 / 回退原生）';
    const account = status.account;
    el('account-quota').textContent = account && account.remainingPercent != null
      ? (account.plan ? account.plan.toUpperCase() + ' · ' : '') + account.remainingPercent + '% 剩余'
      : '—';
    const quotaBar = el('quota-bar');
    const quotaFill = el('quota-fill');
    if (account && account.remainingPercent != null) {
      const pct = Math.max(0, Math.min(100, account.remainingPercent));
      quotaBar.hidden = false;
      quotaFill.style.width = pct + '%';
      quotaFill.className = 'quota-fill' + (pct < 20 ? ' low' : pct < 50 ? ' warn' : '');
    } else {
      quotaBar.hidden = true;
    }
    el('quota-updated').textContent = account && account.fetchedAt
      ? formatAge(account.fetchedAt)
      : '—';
    const failover = status.failover || {};
    el('failover-badge').textContent = failover.enabled ? '已开启' : '已关闭';
    el('failover-badge').className = 'badge ' + (failover.enabled ? 'on' : 'off');
    el('failover-last').textContent = failover.lastFailover
      ? (failover.lastFailover.from ? shortId(failover.lastFailover.from) + ' → ' : '') +
        shortId(failover.lastFailover.to) + '（' +
        formatAge(Math.floor(new Date(failover.lastFailover.at).getTime() / 1000)) + '）'
      : '—';
    el('failover-toggle').checked = Boolean(failover.enabled);
    const pool = status.pool || {};
    currentPool = new Set(Array.isArray(pool.ids) ? pool.ids : []);
    blockedAccounts = new Set(Object.keys(pool.blocked || {}));
    const poolIds = Array.isArray(pool.ids) ? pool.ids : [];
    const poolAccounts = Array.isArray(pool.accounts) ? pool.accounts : [];
    const poolHint = el('pool-hint');
    if (poolHint) {
      poolHint.textContent = poolIds.length
        ? '轮询池：' + poolIds.length + ' 个账号（' +
          poolAccounts.map(function (a) { return a.email || shortId(a.accountId); }).join('、') + '）'
        : '轮询池：未启用（勾选账号并保存后启用均匀派发）';
    }
    const injections = status.injections || { count: 0, recent: [] };
    el('injection-count').textContent = String(injections.count);
    const recent = (injections.recent || []).slice(0, 10);
    el('injection-log').textContent = recent.length
      ? recent.map(function (e) {
          const info = accountIndex.get(e.accountId);
          const email = (info && info.email) ? info.email : shortId(e.accountId);
          const plan = (info && info.plan) ? ' · ' + info.plan : '';
          return formatTime(e.at) + '  ' + email + plan;
        }).join(String.fromCharCode(10))
      : '暂无注入记录';
    el('port-input').value = String(status.port);
  }

  async function loadAccounts() {
    hideResult('accounts-error');
    try {
      const payload = await api('/api/accounts');
      const body = el('accounts-body');
      body.textContent = '';
      const accounts = Array.isArray(payload.accounts) ? payload.accounts : [];
      buildAccountIndex(accounts);
      for (const account of accounts) {
        const tr = document.createElement('tr');
        const email = account.email || '';
        const id = account.id || account.account_id || '';
        const source = account.source === 'native' ? '原生' : '托管';
        const blocked = blockedAccounts.has(id);
        const state = blocked
          ? '<span class="badge off">已踢出</span>'
          : (account.valid === false
              ? '<span class="badge off">失效</span>'
              : (account.is_default ? '<span class="badge on">当前</span>' : '<span class="badge">—</span>'));
        const usage = account.usage;
        const quota = usage && typeof usage.weekly_used_percent === 'number'
          ? (usage.plan ? String(usage.plan).toUpperCase() + ' ' : '') +
            Math.max(0, Math.min(100, 100 - usage.weekly_used_percent)) + '%'
          : '—';
        tr.innerHTML =
          '<td><input type="checkbox" class="pool-check" data-id="' + escapeHtml(id) + '"' +
            (currentPool.has(id) ? ' checked' : '') + (blocked ? ' disabled' : '') + '></td>' +
          '<td>' + escapeHtml(email || '—') + '</td>' +
          '<td class="mono">' + escapeHtml(id) + '</td>' +
          '<td>' + source + '</td>' +
          '<td>' + state + '</td>' +
          '<td>' + escapeHtml(quota) + '</td>' +
          '<td>' + (blocked
            ? '<button data-id="' + escapeHtml(id) + '" class="ghost unblock-btn">解除</button>'
            : '<button data-id="' + escapeHtml(id) + '" class="ghost select-btn"' +
              (account.is_default ? ' disabled' : '') + '>选择</button>') + '</td>';
        body.appendChild(tr);
      }
      if (accounts.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="muted">没有账号</td></tr>';
      }
      for (const btn of document.querySelectorAll('.select-btn')) {
        btn.addEventListener('click', async function () {
          try {
            await api('/api/select', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: btn.getAttribute('data-id') }),
            });
            await Promise.all([loadStatus(), loadAccounts()]);
          } catch (error) {
            setResult('accounts-error', false, '选择失败：' + error.message);
          }
        });
      }
      for (const btn of document.querySelectorAll('.unblock-btn')) {
        btn.addEventListener('click', async function () {
          try {
            await api('/api/unblock', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: btn.getAttribute('data-id') }),
            });
            await Promise.all([loadStatus(), loadAccounts()]);
          } catch (error) {
            setResult('accounts-error', false, '解除失败：' + error.message);
          }
        });
      }
    } catch (error) {
      setResult('accounts-error', false, '获取账号失败：' + error.message);
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  el('enable-btn').addEventListener('click', async function () {
    try { await api('/api/enable', { method: 'POST' }); await loadStatus(); }
    catch (error) { setResult('test-result', false, '启用失败：' + error.message); }
  });
  el('disable-btn').addEventListener('click', async function () {
    try { await api('/api/disable', { method: 'POST' }); await loadStatus(); }
    catch (error) { setResult('test-result', false, '停用失败：' + error.message); }
  });
  el('test-btn').addEventListener('click', async function () {
    try {
      const result = await api('/api/test', { method: 'POST' });
      setResult('test-result', result.ok, result.ok ? '连接正常' : JSON.stringify(result));
    } catch (error) {
      setResult('test-result', false, '测试失败：' + error.message);
    }
  });
  el('refresh-accounts').addEventListener('click', loadAccounts);
  el('save-port').addEventListener('click', async function () {
    try {
      await api('/api/port', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port: Number(el('port-input').value) }),
      });
      await loadStatus();
    } catch (error) { setResult('test-result', false, '保存端口失败：' + error.message); }
  });
  el('save-token').addEventListener('click', async function () {
    try {
      await api('/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: el('token-input').value }),
      });
      el('token-input').value = '';
      await loadStatus();
    } catch (error) { setResult('test-result', false, '保存 Token 失败：' + error.message); }
  });
  el('clear-token').addEventListener('click', async function () {
    try {
      await api('/api/token', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: '' }),
      });
      el('token-input').value = '';
      await loadStatus();
    } catch (error) { setResult('test-result', false, '清除 Token 失败：' + error.message); }
  });

  el('import-file').addEventListener('change', async function () {
    const file = el('import-file').files && el('import-file').files[0];
    if (!file) return;
    el('import-input').value = await file.text();
  });

  el('import-btn').addEventListener('click', async function () {
    try {
      const raw = el('import-input').value.trim();
      if (!raw) { setResult('import-result', false, '请先粘贴或选择 JSON'); return; }
      const authJson = normalizeImport(raw);
      const imported = await api('/api/import', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(authJson),
      });
      setResult('import-result', true, '已导入：' + (imported.email || imported.account_id || imported.id || ''));
      el('import-input').value = '';
      el('import-file').value = '';
      await Promise.all([loadStatus(), loadAccounts()]);
    } catch (error) {
      setResult('import-result', false, '导入失败：' + error.message);
    }
  });

  el('failover-toggle').addEventListener('change', async function () {
    try {
      await api('/api/failover', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: el('failover-toggle').checked }),
      });
      await loadStatus();
    } catch (error) {
      setResult('test-result', false, '切换自动切换失败：' + error.message);
    }
  });

  function checkedPoolIds() {
    const ids = [];
    for (const input of document.querySelectorAll('.pool-check')) {
      if (input.checked) ids.push(input.getAttribute('data-id'));
    }
    return ids;
  }

  el('save-pool').addEventListener('click', async function () {
    try {
      const ids = checkedPoolIds();
      await api('/api/pool', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: ids }),
      });
      currentPool = new Set(ids);
      await loadAccounts();
      await loadStatus();
    } catch (error) {
      setResult('accounts-error', false, '保存轮询池失败：' + error.message);
    }
  });

  el('clear-pool').addEventListener('click', async function () {
    try {
      await api('/api/pool', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [] }),
      });
      currentPool = new Set();
      await loadAccounts();
      await loadStatus();
    } catch (error) {
      setResult('accounts-error', false, '清空轮询池失败：' + error.message);
    }
  });

  async function boot() {
    try {
      const status = await api('/api/status');
      currentPool = new Set(
        status.pool && Array.isArray(status.pool.ids) ? status.pool.ids : [],
      );
    } catch (error) {}
    await loadAccounts();
    await loadStatus();
  }
  boot().catch(function (error) { setResult('test-result', false, '加载失败：' + error.message); });
  setInterval(function () { loadStatus().catch(function () {}); }, 2000);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用量统计 · Codex Router</title>
<style>
  body {
    margin: 0; padding: 24px 28px 48px; min-height: 100vh;
    background:
      radial-gradient(1000px 420px at 12% -10%, rgba(99, 102, 241, 0.10), transparent 60%),
      radial-gradient(900px 400px at 88% -8%, rgba(13, 148, 136, 0.08), transparent 55%),
      #eef1f6;
    background-attachment: fixed;
  }
  .page { max-width: 1100px; margin: 0 auto; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .page-head h1 { font-size: 18px; font-weight: 700; margin: 0; color: #161d2b; }
  .page-head a { color: #4f46e5; text-decoration: none; font-size: 13px; }
  .page-head a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>用量统计</h1>
    <a href="/">返回控制台</a>
  </div>
  <div id="usage-root"></div>
</div>
<script src="/usage-panel.js"></script>
<script>
  (async function () {
    var pollIntervalMs = 5000;
    try {
      var status = await fetch('/api/status').then(function (response) { return response.json(); });
      pollIntervalMs = status.usageIntervalMs || 5000;
    } catch (error) {}
    UsagePanel.init(document.getElementById('usage-root'), { pollIntervalMs: pollIntervalMs });
  })();
</script>
</body>
</html>
